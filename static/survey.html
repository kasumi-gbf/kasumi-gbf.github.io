<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>団アンケート | 霞桜団</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{
  --bg:#fbfaf7; --card:#ffffff; --line:#e3ece9; --ink:#20303a; --mut:#5e7078;
  --sakura:#d97a9a; --mint:#3f9d84; --gold:#b98a3e; --gold-soft:#f6ecd7; --sakura-soft:#fbeaf0; --mint-soft:#e4f5ef;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171b1d; --card:#20262a; --line:#333b3f; --ink:#eef1f2; --mut:#9aa7ac;
    --sakura:#e79bb5; --mint:#5fc2a4; --gold:#d9ad63; --gold-soft:#3a3120; --sakura-soft:#33222a; --mint-soft:#1f2e2a; color-scheme:dark;
  }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 60px;}
.back{font-size:12.5px;color:var(--mut);text-decoration:none;}
h1{font-size:19px;margin:10px 0 4px;display:flex;align-items:center;gap:8px;}
.lead{color:var(--mut);font-size:13px;margin:0 0 18px;line-height:1.7;}
.me{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:18px;}
.me label{font-size:12.5px;color:var(--mut);white-space:nowrap;}
select,input,textarea{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;}
select:focus,input:focus,textarea:focus{border-color:var(--sakura);}
.me select{flex:1;min-width:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
.card.closed{opacity:.8;}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.title{font-size:15px;font-weight:700;line-height:1.5;}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.pill.open{background:var(--mint-soft);color:var(--mint);}
.pill.closed{background:var(--line);color:var(--mut);}
.desc{font-size:13px;color:var(--mut);line-height:1.7;margin:6px 0 0;white-space:pre-wrap;}
.meta{font-size:11.5px;color:var(--mut);margin-top:6px;}
.opts{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.opt{position:relative;border:1px solid var(--line);border-radius:8px;padding:9px 12px;overflow:hidden;cursor:pointer;display:flex;align-items:center;gap:10px;}
.opt.disabled{cursor:default;}
.opt .bar{position:absolute;inset:0 auto 0 0;background:var(--sakura-soft);z-index:0;}
.opt.mine{border-color:var(--sakura);}
.opt > *:not(.bar){position:relative;z-index:1;}
.opt .label{flex:1;font-size:13.5px;}
.opt .count{font-size:12.5px;font-weight:700;color:var(--sakura);font-variant-numeric:tabular-nums;}
.opt .who{display:block;font-size:11px;color:var(--mut);margin-top:2px;}
.vote{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.vote textarea{width:100%;resize:vertical;min-height:38px;}
.btns{display:flex;gap:8px;flex-wrap:wrap;}
button{font-family:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);}
button.primary{background:var(--sakura);border-color:var(--sakura);color:#fff;}
button:disabled{opacity:.5;cursor:default;}
.comments{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;}
.comment{font-size:12.5px;line-height:1.6;}
.comment b{color:var(--mut);font-weight:700;margin-right:6px;}
details.admin{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;}
details.admin summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--mut);}
.form{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.form label{font-size:12px;color:var(--mut);}
.admin-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.admin-row button{font-size:12px;padding:6px 10px;}
.empty{color:var(--mut);font-size:13px;padding:30px 0;text-align:center;}
.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;}
.status.show{opacity:.92;}
.status.err{background:#c0392b;color:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="https://kasumi-gbf.github.io/survey.html">← 霞桜団HPへ</a>
  <h1>
    <svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><rect x="8" y="5" width="24" height="30" rx="3" fill="var(--sakura-soft)" stroke="var(--sakura)" stroke-width="2"/><path d="M13 15 L16 18 L21 12" fill="none" stroke="var(--sakura)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="13" y1="25" x2="27" y2="25" stroke="var(--sakura)" stroke-width="2" stroke-linecap="round"/></svg>
    団アンケート
  </h1>
  <p class="lead">団全体の意見を集めるためのアンケートです。自分の名前を選んでから回答してください。回答はあとから変更・取り消しできます。</p>
  <div class="me">
    <label for="meSelect">回答者</label>
    <select id="meSelect"><option value="">名前を選んでください</option></select>
  </div>
  <div id="list"><div class="empty">読み込み中…（サーバー起動時は30秒ほどかかります）</div></div>

  <details class="admin">
    <summary>団長・副団長用：アンケートの作成・締切</summary>
    <div class="form">
      <label for="pw">管理パスワード</label>
      <input id="pw" type="password" autocomplete="off">
      <label for="newTitle">タイトル</label>
      <input id="newTitle" type="text" maxlength="80" placeholder="例: 次回古戦場の朝活時間">
      <label for="newDesc">説明（任意）</label>
      <textarea id="newDesc" maxlength="400" rows="2"></textarea>
      <label for="newOpts">選択肢（1行に1つ、2〜10個）</label>
      <textarea id="newOpts" rows="4" placeholder="6時〜&#10;7時〜&#10;どちらでも"></textarea>
      <label><input id="newMulti" type="checkbox"> 複数選択を許可する</label>
      <div class="btns"><button class="primary" type="button" id="createBtn">作成する</button></div>
    </div>
    <p class="meta">各アンケートの締切・再開・削除ボタンは、パスワードを入力すると表示されます。</p>
  </details>
</div>
<div class="status" id="status"></div>
<script>
let members = [], surveys = [], loaded = false, statusTimer = null;
const drafts = {};
const meSel = document.getElementById('meSelect'), pwIn = document.getElementById('pw');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function me(){ return meSel.value; }
function toast(text, isErr){
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status show' + (isErr ? ' err' : '');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { el.className = 'status'; }, isErr ? 4000 : 1500);
}

async function api(path, payload){
  const r = await fetch(path, payload ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)} : undefined);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || '通信に失敗しました');
  return d;
}

async function load(){
  try {
    const d = await api('/api/surveys');
    members = d.members || []; surveys = d.surveys || []; loaded = true;
    renderMembers(); render();
  } catch (e) {
    if (!loaded) document.getElementById('list').innerHTML = '<div class="empty">読み込めませんでした。ページを再読み込みしてください。</div>';
  }
}

function renderMembers(){
  const cur = me() || (() => { try { return localStorage.getItem('kasumi_me') || ''; } catch (e) { return ''; } })();
  meSel.innerHTML = '<option value="">名前を選んでください</option>' +
    members.map(m => `<option value="${esc(m)}"${m === cur ? ' selected' : ''}>${esc(m)}</option>`).join('');
}
meSel.onchange = () => { try { localStorage.setItem('kasumi_me', me()); } catch (e) {} Object.keys(drafts).forEach(k => delete drafts[k]); render(); };

function render(){
  const list = document.getElementById('list');
  if (!surveys.length) { list.innerHTML = '<div class="empty">現在アンケートはありません。</div>'; return; }
  list.innerHTML = '';
  const isAdmin = pwIn.value.length > 0;
  surveys.forEach(s => {
    const votes = s.votes || {};
    const mine = votes[me()] || null;
    const draft = drafts[s.id] || {c: mine ? mine.c.slice() : [], m: mine ? mine.m : ''};
    drafts[s.id] = draft;
    const counts = s.options.map(() => []);
    Object.entries(votes).forEach(([name, v]) => (v.c || []).forEach(i => counts[i] && counts[i].push(name)));
    const voters = Object.values(votes).filter(v => (v.c || []).length).length;
    const max = Math.max(1, ...counts.map(c => c.length));
    const canVote = !s.closed && !!me();

    const card = document.createElement('div');
    card.className = 'card' + (s.closed ? ' closed' : '');
    card.innerHTML = `
      <div class="head"><div class="title">${esc(s.title)}</div><span class="pill ${s.closed ? 'closed' : 'open'}">${s.closed ? '締切' : '受付中'}</span></div>
      ${s.desc ? `<p class="desc">${esc(s.desc)}</p>` : ''}
      <div class="meta">${esc(s.created.replace('T',' '))} 作成・${voters}人が回答・${s.multi ? '複数選択可' : '1つ選択'}</div>
      <div class="opts">${s.options.map((o, i) => `
        <div class="opt${canVote ? '' : ' disabled'}${draft.c.includes(i) ? ' mine' : ''}" data-i="${i}" role="${s.multi ? 'checkbox' : 'radio'}" aria-label="${esc(o)}" aria-checked="${draft.c.includes(i)}" tabindex="${canVote ? 0 : -1}">
          <div class="bar" style="width:${Math.round(counts[i].length / max * 100)}%"></div>
          <span class="label">${draft.c.includes(i) ? '● ' : ''}${esc(o)}${counts[i].length ? `<span class="who">${counts[i].map(esc).join('、')}</span>` : ''}</span>
          <span class="count">${counts[i].length}</span>
        </div>`).join('')}</div>
      ${canVote ? `<div class="vote">
        <textarea maxlength="200" rows="1" placeholder="コメント（任意）">${esc(draft.m)}</textarea>
        <div class="btns"><button class="primary send" type="button">${mine ? '回答を更新' : '回答する'}</button>${mine ? '<button class="cancel" type="button">回答を取り消す</button>' : ''}</div>
      </div>` : (!s.closed ? '<p class="meta">回答するには、上の「回答者」で自分の名前を選んでください。</p>' : '')}
      ${Object.entries(votes).some(([, v]) => v.m) ? `<div class="comments">${Object.entries(votes).filter(([, v]) => v.m).map(([n, v]) => `<div class="comment"><b>${esc(n)}</b>${esc(v.m)}</div>`).join('')}</div>` : ''}
      ${isAdmin ? `<div class="admin-row">
        <button type="button" class="adm" data-a="${s.closed ? 'reopen' : 'close'}">${s.closed ? '受付を再開' : '締め切る'}</button>
        <button type="button" class="adm" data-a="delete">削除</button></div>` : ''}`;

    if (canVote) {
      card.querySelectorAll('.opt').forEach(el => {
        const pick = () => {
          const i = Number(el.dataset.i);
          if (s.multi) draft.c = draft.c.includes(i) ? draft.c.filter(x => x !== i) : draft.c.concat(i);
          else draft.c = draft.c.includes(i) ? [] : [i];
          render();
        };
        el.onclick = pick;
        el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
      });
      const ta = card.querySelector('textarea');
      ta.oninput = () => { draft.m = ta.value; };
      card.querySelector('.send').onclick = () => vote(s.id, draft.c, ta.value.trim());
      const cancel = card.querySelector('.cancel');
      if (cancel) cancel.onclick = () => vote(s.id, [], '');
    }
    card.querySelectorAll('.adm').forEach(b => {
      b.onclick = () => {
        if (b.dataset.a === 'delete' && !b.dataset.armed) {
          b.dataset.armed = '1';
          b.textContent = 'もう一度押すと削除';
          return;
        }
        admin({action: b.dataset.a, id: s.id});
      };
    });
    list.appendChild(card);
  });
}

async function vote(id, choices, comment){
  toast('送信中…');
  try {
    const d = await api('/api/survey_vote', {id, member: me(), choices, comment});
    surveys = d.surveys; delete drafts[id];
    toast(choices.length || comment ? '回答しました' : '取り消しました');
  } catch (e) { toast(e.message, true); }
  render();
}

async function admin(payload){
  toast('処理中…');
  try {
    const d = await api('/api/survey_admin', Object.assign({pw: pwIn.value}, payload));
    surveys = d.surveys;
    toast('完了しました');
    return true;
  } catch (e) { toast(e.message, true); return false; }
  finally { render(); }
}

pwIn.oninput = render;
document.getElementById('createBtn').onclick = async () => {
  const opts = document.getElementById('newOpts').value.split('\n').map(s => s.trim()).filter(Boolean);
  const ok = await admin({action:'create', title: document.getElementById('newTitle').value, desc: document.getElementById('newDesc').value,
    options: opts, multi: document.getElementById('newMulti').checked});
  if (ok) ['newTitle','newDesc','newOpts'].forEach(id => { document.getElementById(id).value = ''; });
};

load();
setInterval(() => {
  const a = document.activeElement;
  if (!a || !/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) load();
}, 30000);
</script>
</body>
</html>
