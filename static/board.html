<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高難易度 参加者ボード | 霞桜団</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{
  --bg:#fbfaf7; --card:#ffffff; --line:#e3ece9; --ink:#20303a; --mut:#5e7078;
  --sakura:#d97a9a; --mint:#3f9d84; --gold:#b98a3e; --gold-soft:#f6ecd7; --sakura-soft:#fbeaf0;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171b1d; --card:#20262a; --line:#333b3f; --ink:#eef1f2; --mut:#9aa7ac;
    --sakura:#e79bb5; --mint:#5fc2a4; --gold:#d9ad63; --gold-soft:#3a3120; --sakura-soft:#33222a; color-scheme:dark;
  }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 60px;}
.back{font-size:12.5px;color:var(--mut);text-decoration:none;}
h1{font-size:19px;margin:10px 0 4px;display:flex;align-items:center;gap:8px;}
.lead{color:var(--mut);font-size:13px;margin:0 0 20px;line-height:1.7;}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab{flex:1;min-width:96px;text-align:center;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.tab.active{background:var(--sakura-soft);border-color:var(--sakura);color:var(--sakura);}
.sched{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px;}
.sched label{font-size:12.5px;color:var(--mut);white-space:nowrap;}
.sched input{flex:1;border:none;background:transparent;color:var(--ink);font-size:14px;outline:none;min-width:0;font-family:inherit;}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.row-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.attr-badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.row-label{font-size:13.5px;font-weight:700;}
.slot{position:relative;}
.slot select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 44px 8px 10px;font-size:13.5px;color:var(--ink);background:var(--bg);outline:none;appearance:none;-webkit-appearance:none;font-family:inherit;}
.slot select:focus{border-color:var(--sakura);}
.slot::after{content:"▾";position:absolute;right:30px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:11px;pointer-events:none;}
.slot .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--mut);font-size:14px;cursor:pointer;padding:4px 6px;}
.field{margin-top:6px;}
.field input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink);background:transparent;outline:none;font-family:inherit;}
.field input:focus{border-color:var(--mint);}
.field input::placeholder{color:var(--mut);opacity:.55;}
.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;}
.status.show{opacity:.92;}
.status.err{background:#c0392b;color:#fff;}
.note{font-size:11.5px;color:var(--mut);line-height:1.7;margin-top:20px;}
.loading{color:var(--mut);font-size:13px;padding:40px 0;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="https://kasumi-gbf.github.io/highdifficulty.html">← 霞桜団HPへ</a>
  <h1>
    <svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 L32 10 V18 C32 26 26 31 20 35 C14 31 8 26 8 18 V10 Z" fill="var(--gold-soft)" stroke="var(--gold)" stroke-width="2"/><path d="M20 14 C22 18 26 19 26 23 C26 27 23 29 20 29 C17 29 14 27 14 23 C14 19 18 18 20 14 Z" fill="var(--sakura)"/></svg>
    高難易度 参加者ボード
  </h1>
  <p class="lead">ヴェルサシア・ルシゼロ・天元の参加者を、属性ごとに登録できます。ログイン不要で、誰でもその場で編集できます。</p>
  <div class="tabs" id="tabs"></div>
  <div class="sched">
    <label for="schedInput">開催日程</label>
    <input id="schedInput" type="text" maxlength="60" placeholder="例: 1/20(月) 21:00〜">
  </div>
  <div id="rows"><div class="loading">読み込み中…（サーバー起動時は30秒ほどかかります）</div></div>
  <p class="note">名前欄は誰でも書き換えられる簡易的な仕組みです。埋まっている枠を上書きしないよう、団内チャットやDiscordであわせてご確認ください。</p>
</div>
<div class="status" id="status"></div>
<script>
const QUESTS = [{key:'versa',label:'ヴェルサシア'},{key:'luci',label:'ルシゼロ'},{key:'tengen',label:'天元'}];
const ATTRS = [
  {key:'fire',label:'火',color:'#e0554f'},{key:'water',label:'水',color:'#3f8fd9'},
  {key:'earth',label:'土',color:'#b98a3e'},{key:'wind',label:'風',color:'#3f9d84'},
  {key:'dark',label:'闇',color:'#6b5b95'},{key:'light',label:'光',color:'#d0a72e'},
];
const OTHER = '__other__';
let quest = 'versa', members = [], board = {s:{}, e:{}}, loaded = false, statusTimer = null;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toast(text, isErr){
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status show' + (isErr ? ' err' : '');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { el.className = 'status'; }, isErr ? 4000 : 1500);
}

async function load(){
  try {
    const r = await fetch('/api/board');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '読み込みに失敗しました');
    members = d.members || []; board = d.board || {}; loaded = true;
    render();
  } catch (e) {
    if (!loaded) document.getElementById('rows').innerHTML = '<div class="loading">読み込めませんでした。ページを再読み込みしてください。</div>';
  }
}

async function post(payload){
  toast('保存中…');
  try {
    const r = await fetch('/api/board', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '保存に失敗しました');
    board = d.board || board;
    toast('保存しました');
  } catch (e) {
    toast(e.message, true);
  }
  render();
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  QUESTS.forEach(q => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab' + (q.key === quest ? ' active' : '');
    b.textContent = q.label;
    b.onclick = () => { quest = q.key; render(); };
    tabs.appendChild(b);
  });
}

function render(){
  renderTabs();
  if (!loaded) return;
  const sched = document.getElementById('schedInput');
  sched.value = (board.s || {})[quest] || '';
  sched.onchange = () => post({quest, schedule: sched.value});

  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  ATTRS.forEach(attr => {
    const entry = (board.e || {})[quest + '|' + attr.key] || {};
    const name = entry.n || '', memo = entry.m || '';
    const isOther = name !== '' && !members.includes(name);
    const opts = ['<option value="">（未定）</option>']
      .concat(members.map(m => `<option value="${esc(m)}"${m === name ? ' selected' : ''}>${esc(m)}</option>`))
      .concat([`<option value="${OTHER}"${isOther ? ' selected' : ''}>その他（自由入力）</option>`]).join('');
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="row-head"><div class="attr-badge" style="background:${attr.color}">${attr.label}</div><div class="row-label">${attr.label}属性</div></div>
      <div class="slot"><select aria-label="${attr.label}属性の参加者">${opts}</select><button class="clear" type="button" aria-label="クリア">✕</button></div>
      <div class="field custom" ${isOther ? '' : 'hidden'}><input type="text" maxlength="30" placeholder="名前を入力" value="${esc(isOther ? name : '')}"></div>
      <div class="field"><input class="memo" type="text" maxlength="80" placeholder="コメント（初参加、練習中、他属性可など）" value="${esc(memo)}"></div>`;
    const sel = row.querySelector('select'), customWrap = row.querySelector('.custom'),
          customIn = customWrap.querySelector('input'), memoIn = row.querySelector('.memo');
    const save = () => {
      const n = sel.value === OTHER ? customIn.value.trim() : sel.value;
      if (n === name && memoIn.value.trim() === memo) return;
      post({quest, attr: attr.key, name: n, memo: memoIn.value.trim()});
    };
    sel.onchange = () => {
      if (sel.value === OTHER) { customWrap.hidden = false; customIn.focus(); } else { customWrap.hidden = true; save(); }
    };
    customIn.onchange = save;
    memoIn.onchange = save;
    row.querySelector('.clear').onclick = () => post({quest, attr: attr.key, name: '', memo: ''});
    rows.appendChild(row);
  });
}

render();
load();
setInterval(() => {
  const a = document.activeElement;
  if (!a || !/^(INPUT|SELECT)$/.test(a.tagName)) load();
}, 30000);
</script>
</body>
</html>
